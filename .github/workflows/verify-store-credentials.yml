name: Verify Store Credentials

# Checks that the Chrome Web Store credentials work, without uploading or
# changing anything. Run it from the Actions tab: Verify Store Credentials ->
# Run workflow.
#
# Use it after setting the secrets up for the first time, after rotating the
# service account key, or any time a release fails and you want to know
# whether the credentials are the reason.
#
# This workflow cannot publish. It only ever passes --dry-run, so there is no
# input to get wrong and no way for it to touch the live listing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm ci`. publish-store.mjs uses only Node's standard library, so
      # there is nothing to install - which is a nice check on that claim.
      - name: Chrome Web Store dry run
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/publish-store.mjs --dry-run
